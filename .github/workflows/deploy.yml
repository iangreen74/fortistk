name: Deploy Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  PYTHON_VERSION: '3.11'
  TERRAFORM_VERSION: '1.6.0'

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python linters
        run: |
          pip install black flake8 ruff

      - name: Run ruff
        run: |
          ruff check ./agents ./backend ./cli ./ai

      - name: Run black
        run: |
          black --check ./agents ./backend ./cli ./ai

      - name: Run flake8
        run: |
          flake8 ./agents ./backend ./cli ./ai --max-line-length=100 --extend-ignore=E203,W503

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform fmt
        run: |
          terraform fmt -check -recursive

      - name: Terraform validate
        run: |
          cd infrastructure
          terraform init -backend=false
          terraform validate

  test:
    name: Test Infrastructure
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Plan (Staging)
        if: github.ref == 'refs/heads/staging' || github.base_ref == 'staging'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
        run: |
          cd infrastructure
          terraform init
          terraform workspace select staging || terraform workspace new staging
          terraform plan -var-file=environments/staging.tfvars -out=staging.tfplan

      - name: Terraform Plan (Production)
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        run: |
          cd infrastructure
          terraform init
          terraform workspace select production || terraform workspace new production
          terraform plan -var-file=environments/production.tfvars -out=production.tfplan

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        agent: [wallet_score_agent, tx_analyzer_agent, threat_hunter_agent]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ matrix.agent }}:${{ github.sha }} ./agents/${{ matrix.agent }}

      - name: Push Docker image (Staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          docker tag ${{ matrix.agent }}:${{ github.sha }} ${{ secrets.DOCKER_REGISTRY }}/${{ matrix.agent }}:staging-${{ github.sha }}
          docker tag ${{ matrix.agent }}:${{ github.sha }} ${{ secrets.DOCKER_REGISTRY }}/${{ matrix.agent }}:staging-latest
          docker push ${{ secrets.DOCKER_REGISTRY }}/${{ matrix.agent }}:staging-${{ github.sha }}
          docker push ${{ secrets.DOCKER_REGISTRY }}/${{ matrix.agent }}:staging-latest

      - name: Push Docker image (Production)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ matrix.agent }}:${{ github.sha }} ${{ secrets.DOCKER_REGISTRY }}/${{ matrix.agent }}:${{ github.sha }}
          docker tag ${{ matrix.agent }}:${{ github.sha }} ${{ secrets.DOCKER_REGISTRY }}/${{ matrix.agent }}:latest
          docker push ${{ secrets.DOCKER_REGISTRY }}/${{ matrix.agent }}:${{ github.sha }}
          docker push ${{ secrets.DOCKER_REGISTRY }}/${{ matrix.agent }}:latest

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/staging'
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Deploy with Terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_STAGING }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_STAGING }}
        run: |
          cd infrastructure
          terraform init
          terraform workspace select staging
          terraform apply -var-file=environments/staging.tfvars -var="image_tag=staging-${{ github.sha }}" -auto-approve

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://production.example.com
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Deploy with Terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        run: |
          cd infrastructure
          terraform init
          terraform workspace select production
          terraform apply -var-file=environments/production.tfvars -var="image_tag=${{ github.sha }}" -auto-approve
